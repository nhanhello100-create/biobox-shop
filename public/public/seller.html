<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIOBOX — Seller Dashboard</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="container nav"><div class="brand">BIO<span>BOX</span> <small style="font:600 12px 'Be Vietnam Pro';color:#777">SELLER</small></div><div class="navlinks"><button class="pill" onclick="refreshAll()">↻ Làm mới</button><button class="pill cartbtn" onclick="logout()">Đăng xuất</button></div></div></header>
<main class="admin"><div class="container"><div id="login" class="panel" style="max-width:500px;margin:50px auto"><h2>Đăng nhập khu vực người bán</h2><p class="muted">Nhập mã quản trị để xem đơn hàng và tin nhắn.</p><div class="field"><label>Mã quản trị</label><input id="pin" type="password" placeholder="Mã quản trị"></div><button class="btn primary wide" onclick="login()">Vào quản trị</button></div><div id="dashboard" style="display:none"><div class="admin-grid"><aside class="panel"><div class="section-head"><h2 style="font-size:26px">Đơn hàng</h2></div><div id="orders"></div></aside><section class="panel"><div id="orderDetail"><p class="muted">Chọn một đơn hàng để xem chi tiết.</p></div><div class="adminchat"><div class="section-head" style="margin-top:18px"><h2 style="font-size:26px">Tin nhắn</h2></div><div class="msgs" id="msgs"></div><div class="chatinput"><input id="reply" placeholder="Nhắn lại cho khách..." onkeydown="if(event.key==='Enter')sendReply()"><button class="btn primary" onclick="sendReply()">Gửi</button></div></div></section></div></div></div></main>
<script>
let pin=localStorage.getItem('bioboxSellerPin')||'',orders=[],selected=null,conversation=null;
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
function login(){pin=document.getElementById('pin').value.trim();localStorage.setItem('bioboxSellerPin',pin);loadOrders().then(ok=>{if(ok){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';refreshAll()}})}
function logout(){localStorage.removeItem('bioboxSellerPin');location.reload()}
async function api(url,opt={}){opt.headers=Object.assign({},opt.headers||{}, {'x-seller-pin':pin});let r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('bioboxSellerPin');alert('Mã quản trị không đúng.');location.reload()}return r}
async function loadOrders(){let r=await api('/api/orders');if(!r.ok)return false;orders=await r.json();renderOrders();return true}
function renderOrders(){let el=document.getElementById('orders');if(!orders.length){el.innerHTML='<p class="muted">Chưa có đơn hàng.</p>';return}el.innerHTML=orders.map(o=>`<div class="order ${selected&&selected.id===o.id?'active':''}" onclick="selectOrder('${o.id}')"><b>#${o.id.slice(0,8).toUpperCase()}</b><div>${escapeHtml(o.customer.name)} · ${escapeHtml(o.customer.phone)}</div><div class="muted" style="font-size:12px">${new Date(o.createdAt).toLocaleString('vi-VN')}</div><span class="status">${escapeHtml(o.status)}</span></div>`).join('')}
function selectOrder(id){selected=orders.find(o=>o.id===id);conversation=selected.conversationId;renderOrders();renderDetail();loadMessages()}
function renderDetail(){let o=selected;if(!o)return;document.getElementById('orderDetail').innerHTML=`<div class="section-head"><div><div class="eyebrow">ĐƠN HÀNG</div><h2 style="font-size:30px">#${o.id.slice(0,8).toUpperCase()}</h2></div><select onchange="updateStatus(this.value)"><option ${o.status==='Mới'?'selected':''}>Mới</option><option ${o.status==='Đang xử lý'?'selected':''}>Đang xử lý</option><option ${o.status==='Đang giao'?'selected':''}>Đang giao</option><option ${o.status==='Hoàn tất'?'selected':''}>Hoàn tất</option></select></div><p><b>Khách:</b> ${escapeHtml(o.customer.name)}<br><b>SĐT:</b> ${escapeHtml(o.customer.phone)}<br><b>Địa chỉ:</b> ${escapeHtml(o.customer.address)}<br><b>Ghi chú:</b> ${escapeHtml(o.note||'—')}</p><hr style="border:0;border-top:1px solid #dfd2b8"><b>Sản phẩm</b>${o.items.map(i=>`<div style="display:flex;justify-content:space-between;padding:9px 0"><span>${escapeHtml(i.name)} × ${i.qty}</span><span>${i.unitPrice?money(i.unitPrice*i.qty):'Liên hệ'}</span></div>`).join('')}<div class="total">${o.total?money(o.total):'Liên hệ báo giá'}</div>`}
async function updateStatus(status){if(!selected)return;let r=await api('/api/orders/'+selected.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(r.ok){selected=await r.json();orders=orders.map(o=>o.id===selected.id?selected:o);renderOrders();renderDetail()}}
async function loadMessages(){if(!conversation){document.getElementById('msgs').innerHTML='<p class="muted">Chọn đơn hàng để mở cuộc trò chuyện.</p>';return}let r=await fetch('/api/messages?conversationId='+encodeURIComponent(conversation));let ms=await r.json();document.getElementById('msgs').innerHTML=ms.map(m=>`<div class="bubble ${m.sender==='seller'?'me':'them'}">${escapeHtml(m.text)}</div>`).join('');let b=document.getElementById('msgs');b.scrollTop=b.scrollHeight}
async function sendReply(){let input=document.getElementById('reply'),text=input.value.trim();if(!text||!conversation)return;input.value='';await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:conversation,sender:'seller',text})});loadMessages()}
async function refreshAll(){if(!pin)return;await loadOrders();if(selected){let fresh=orders.find(o=>o.id===selected.id);if(fresh)selected=fresh;renderDetail();loadMessages()}}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(pin){document.getElementById('pin').value=pin;loadOrders().then(ok=>{if(ok){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';refreshAll()}})}
setInterval(refreshAll,4000);
</script></body></html>
